apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: backend-allow-client
  namespace: istio-lab
spec:
  selector:
    matchLabels:
      app: backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-lab/sa/client-sa
      to:
        - operation:
            methods: ["GET"]
