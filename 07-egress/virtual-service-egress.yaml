apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin-egress
  namespace: istio-lab
spec:
  hosts:
    - httpbin.org
  gateways:
    - mesh
    - httpbin-egress
  tls:
    - match:
        - gateways:
            - mesh
          port: 443
          sniHosts:
            - httpbin.org
      route:
        - destination:
            host: istio-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 443
    - match:
        - gateways:
            - httpbin-egress
          port: 443
          sniHosts:
            - httpbin.org
      route:
        - destination:
            host: httpbin.org
            port:
              number: 443
