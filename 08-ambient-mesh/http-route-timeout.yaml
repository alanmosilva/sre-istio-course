apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: ambient-lab
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: backend
      port: 80
  rules:
    - timeouts:
        request: 2s
      backendRefs:
        - name: backend-v1
          port: 80
