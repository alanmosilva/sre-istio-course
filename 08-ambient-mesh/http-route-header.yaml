apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: ambient-lab
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: backend
      port: 80
  rules:
    - matches:
        - headers:
            - name: x-version
              value: v2
      backendRefs:
        - name: backend-v2
          port: 80
    - backendRefs:
        - name: backend-v1
          port: 80
